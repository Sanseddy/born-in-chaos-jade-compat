plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6,7)'
}

version = '1.0.0'
group = 'com.infected'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                infected_ore_info {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.level.net.minecraftforge', 'debug'
            mods {
                infected_ore_info {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url = "https://maven.minecraftforge.net/"
        allowInsecureProtocol = true
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    
    // Jade for Forge 1.20.1
    compileOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
    runtimeOnly fg.deobf("maven.modrinth:jade:11.13.2+forge")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}
